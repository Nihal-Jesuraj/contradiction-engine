[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#111821"
textColor = "#E7EEF6"
font = "sans serif"
# Native badge/markdown colours follow the HUD palette (ui/theme.py).
redColor = "#FB7185"
orangeColor = "#FBBF24"
greenColor = "#34D399"
grayColor = "#94A3B8"
blueColor = "#38BDF8"
# Inline code (record IDs) must not borrow the CLEAR green.
codeTextColor = "#9BA9BA"
codeBackgroundColor = "#17202B"

[server]
maxUploadSize = 5

[client]
# "minimal" hides the toolbar menu (Deploy, Settings, etc.) when no
# app-specific toolbar options are registered.
toolbarMode = "minimal"
