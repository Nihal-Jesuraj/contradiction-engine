[theme]
base = "dark"
primaryColor = "#D9B26F"
backgroundColor = "#0C0B0A"
secondaryBackgroundColor = "#121110"
textColor = "#F1EBE0"
font = "sans serif"
# Native badge/markdown colours follow the HUD palette (ui/theme.py).
redColor = "#FB7185"
orangeColor = "#FB923C"
greenColor = "#34D399"
grayColor = "#9C9484"
blueColor = "#D9B26F"
# Inline code (record IDs) must not borrow the CLEAR green.
codeTextColor = "#A39A8B"
codeBackgroundColor = "#181614"

[server]
maxUploadSize = 5

[client]
# "minimal" hides the toolbar menu (Deploy, Settings, etc.) when no
# app-specific toolbar options are registered.
toolbarMode = "minimal"
