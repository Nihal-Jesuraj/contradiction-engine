[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B26"
textColor = "#E6EDF3"
font = "sans serif"

[server]
maxUploadSize = 5

[client]
# "minimal" hides the toolbar menu (Deploy, Settings, etc.) when no
# app-specific toolbar options are registered.
toolbarMode = "minimal"
