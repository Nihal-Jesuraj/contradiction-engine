[project]
name = "contradiction-engine"
version = "0.1.0"
description = "Explainable temporal contradiction detection for fictional investigations"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40,<2",
    "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["contradiction_engine/tests"]
addopts = "-q"
