[project]
name = "chronoclash"
version = "1.0.0"
description = "Temporal contradiction detection engine for forensic evidence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic>=2.8,<3",
    "streamlit>=1.40,<2",
    "plotly>=6,<8",
    "pandas>=2.2,<4",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
